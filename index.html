<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flame Tests &amp; Ammonium Ions</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f9fc;--card:#fff;--tx:#1f2430;--mu:#5d6575;--bd:#d9e4ec;--ac:#0a9be0;--ac2:#f58a14;--ok:#1d8a4e;--bad:#d12a2a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161b;--card:#1a232a;--tx:#edf2f5;--mu:#9aabb6;--bd:#2d3b45;--ac:#4cc3ff;--ac2:#ffa033;--ok:#4cd08a;--bad:#ff6b6b}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
main{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;margin:.1em 0}h2{font-size:1.2rem;margin:.2em 0}.sub{color:var(--mu);margin:0 0 10px}
button{font:inherit;color:var(--tx)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
nav button{padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:999px;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#06202e;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.btn{padding:8px 14px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer}
.btn.p{background:var(--ac2);color:#1a1000;border-color:var(--ac2);font-weight:700}.btn.on{outline:3px solid var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}@media(max-width:680px){.two{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,#0e1218,#1b2430);border-radius:12px;padding:6px;color:#fff}
.stage.lt{background:linear-gradient(135deg,rgba(10,155,224,.10),rgba(245,138,20,.10));color:var(--tx)}
.eq{padding:10px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;overflow-x:auto;white-space:nowrap;margin:8px 0;font-family:ui-monospace,Menlo,monospace}
.res{padding:10px 12px;border-radius:10px;border-left:5px solid var(--ok);background:var(--bg);margin-top:8px}.res.no{border-color:var(--bad)}
.key{padding:10px 12px;border-radius:10px;border-left:5px solid var(--ac2);background:var(--bg);margin:8px 0;font-size:.95rem}
.steps{list-style:none;padding:0;margin:0}.steps li{padding:8px 10px;border-radius:8px;margin:4px 0;border:1px solid var(--bd);cursor:pointer;opacity:.6}.steps li.on{opacity:1;border-color:var(--ac2);background:var(--bg);font-weight:600}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:1px solid var(--bd)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.opt.good{border-color:var(--ok);background:rgba(29,138,78,.15)}.opt.bad{border-color:var(--bad);background:rgba(209,42,42,.12)}
.note{font-size:.9rem;color:var(--mu)}
svg text{font-family:system-ui;fill:currentColor}
.flick{animation:flick .35s infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{from{transform:scaleY(.94) scaleX(1.02)}to{transform:scaleY(1.05) scaleX(.97)}}
.up{animation:up 1.1s ease-out both}@keyframes up{from{transform:translateX(-22px)}to{transform:none}}
.down{animation:down .9s ease-in both}@keyframes down{from{transform:translateX(22px)}to{transform:none}}
.ph{animation:ph 1.8s .8s ease-out both}@keyframes ph{from{transform:translateX(0);opacity:0}15%{opacity:1}to{transform:translateX(100px);opacity:1}}
.bub{animation:rise 2s infinite;fill:rgba(200,230,255,.8)}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.smoke{animation:sm 2.5s infinite;fill:rgba(255,255,255,.85)}@keyframes sm{from{transform:translateY(0) scale(.5);opacity:.9}to{transform:translateY(-50px) scale(1.6);opacity:0}}
.pop{animation:pop .6s both;transform-box:fill-box;transform-origin:center}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
</style></head><body><main>
<h1>🔥 Flame Tests &amp; the Ammonium Ion Test</h1>
<p class="sub">How to do them · why flames glow in colour · how to spot NH₄⁺ · practice</p>
<nav id="nav"></nav><div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s);let tab=0;
const tabs=['1 · Flame test','2 · Why colours?','3 · Ammonium test','4 · Practice','5 · Explain it'];
function nav(){$('#nav').innerHTML=tabs.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};nav();draw()">${t}</button>`).join('')}
const M={Li:['Lithium','Li⁺','red','#e8283f'],Na:['Sodium','Na⁺','yellow/orange','#ffa51f'],K:['Potassium','K⁺','lilac','#c9a0f5'],Rb:['Rubidium','Rb⁺','red/purple','#b4366f'],Cs:['Caesium','Cs⁺','blue/violet','#6b5df2'],Be:['Beryllium','Be²⁺','(no colour)',null],Mg:['Magnesium','Mg²⁺','(no colour)',null],Ca:['Calcium','Ca²⁺','(brick) red','#c9472b'],Sr:['Strontium','Sr²⁺','(crimson) red','#dc143c'],Ba:['Barium','Ba²⁺','(apple) green','#8fdc3c'],Cu:['Copper','Cu²⁺','blue-green (not Group 1/2)','#1ab5a0']};
const keys=Object.keys(M);
function flame(k,on,mask){const col=on&&M[k][3],mc=mask&&on?'#ffa51f':col;
 return `<svg viewBox="0 0 180 230" width="100%" style="max-width:240px;display:block;margin:auto">
 <rect x="68" y="196" width="44" height="12" rx="3" fill="#777"/><rect x="82" y="150" width="16" height="48" fill="#999"/>
 <ellipse class="flick" cx="90" cy="118" rx="24" ry="52" fill="#3a6fe0" opacity=".35"/>
 ${mc?`<ellipse class="flick" cx="90" cy="104" rx="30" ry="62" fill="${mc}" opacity=".7"/>`:''}
 <ellipse class="flick" cx="90" cy="136" rx="10" ry="22" fill="#2b4fc0" opacity=".8"/>
 <line x1="6" y1="112" x2="88" y2="112" stroke="#bbb" stroke-width="3"/><circle cx="90" cy="112" r="5" fill="none" stroke="#ddd" stroke-width="2"/>
 ${mc?`<circle cx="90" cy="112" r="4" fill="${mc}"/>`:''}</svg>`}
/* T1 */
let m1='Sr',st1=4,mask=false;
const FS=['Wear safety glasses and a lab coat. In a fume cupboard, light a Bunsen burner.','Add a few drops of concentrated hydrochloric acid to the solid and mix so it begins to dissolve. (HCl converts the compound to a chloride; chlorides are more volatile, giving better results.)','Dip a clean metal wire (platinum or nichrome) or a silica rod into the mixture.','Hold the end of the wire or rod in the flame and observe the colour.'];
function t1(){const d=M[m1];
 return `<div class="card"><h2>How to do a flame test</h2><p class="note">A flame test can show some Group 1 and 2 metal cations in a compound. It doesn’t work for all of them.</p>
 <div class="two"><div><ol class="steps">${FS.map((s,i)=>`<li class="${st1==i+1?'on':''}" onclick="st1=${i+1};draw()"><b>${i+1}.</b> ${s}</li>`).join('')}</ol>
 <div class="row"><button class="btn" onclick="st1=Math.max(1,st1-1);draw()">◀</button><button class="btn p" onclick="st1=Math.min(4,st1+1);draw()">Next step ▶</button></div></div>
 <div><div class="stage">${flame(m1,st1>=4,mask)}</div><p style="text-align:center"><b>${d[0]} (${d[1]})</b> → ${d[3]?`<span class="sw" style="background:${d[3]}"></span>`:''}<b>${st1>=4?d[2]:'…'}</b></p></div></div>
 <div class="row"><span class="note">Try a metal:</span>${keys.map(k=>`<button class="btn ${k==m1?'on':''}" onclick="m1='${k}';draw()">${M[k][1]}</button>`).join('')}</div>
 <div class="row"><label><input type="checkbox" ${mask?'checked':''} onchange="mask=this.checked;draw()"> Sample contains sodium impurity</label></div>
 ${mask&&d[3]&&m1!='Na'?'<div class="res no"><b>Problem 1:</b> intense sodium yellow/orange hides the other colour!</div>':''}
 <div class="key"><b>Problem 2:</b> describing colours in words is subjective. Lilac, lavender, mauve, plum, violet… people see colour differently, and “brick red” depends on your local bricks.</div>
 <div class="key"><b>Learning tip:</b> a flame test on a magnesium <i>compound</i> has nothing to do with burning magnesium metal. The compound already contains Mg²⁺ ions.</div></div>
 <div class="card"><b>Table A</b> (tap a row)<table style="width:100%;border-collapse:collapse;margin-top:6px">${keys.map(k=>`<tr onclick="m1='${k}';st1=4;draw()" style="cursor:pointer;${k==m1?'background:var(--bg)':''}"><td style="border:1px solid var(--bd);padding:5px">${M[k][0]}</td><td style="border:1px solid var(--bd);padding:5px">${M[k][1]}</td><td style="border:1px solid var(--bd);padding:5px">${M[k][3]?`<span class="sw" style="background:${M[k][3]}"></span>`:''}${M[k][2]}</td></tr>`).join('')}</table></div>`}
/* T2 */
let m2='Na',s2=0,tm=[];
function play2(){tm.forEach(clearTimeout);s2=0;draw();tm=[setTimeout(()=>{s2=1;draw()},1200),setTimeout(()=>{s2=2;draw()},3200)]}
function t2(){const d=M[m2],c=d[3]||'#8a8f98',vis=!!d[3];
 const cx=110,cyy=100,wl=m2=='Na'?590:null;
 let a=`<svg viewBox="0 0 330 200" width="100%"><g style="color:#cfd8e0">${[30,52,74].map(r=>`<circle cx="${cx}" cy="${cyy}" r="${r}" fill="none" stroke="#5b6b78" stroke-dasharray="4 4"/>`).join('')}</g>
 <circle cx="${cx}" cy="${cyy}" r="11" fill="#e0b040"/><text x="${cx}" y="${cyy+4}" text-anchor="middle" style="font-size:11px;fill:#222;font-weight:700">+</text>
 <circle cx="${cx-30}" cy="${cyy}" r="5" fill="#6fa8ff"/><circle cx="${cx}" cy="${cyy-30}" r="5" fill="#6fa8ff"/>
 ${s2==1?`<circle class="up" cx="${cx+74}" cy="${cyy}" r="7" fill="#6fa8ff"/><text x="${cx+30}" y="${cyy-84}" style="font-size:13px;fill:#ffb54d" text-anchor="middle">🔥 absorbs energy</text>`:`<circle class="${s2==2?'down':''}" cx="${cx+52}" cy="${cyy}" r="7" fill="#6fa8ff"/>`}
 ${s2==2?`<g class="ph" style="color:${c}"><path d="M${cx+60} ${cyy} q5 -9 10 0 t10 0 t10 0" fill="none" stroke="${c}" stroke-width="3" ${vis?'':'stroke-dasharray="3 3"'}/></g><text x="${cx+110}" y="${cyy+34}" style="font-size:12px;fill:${c}">${vis?'light emitted!':'invisible light'}</text>`:''}
 <text x="${cx}" y="192" text-anchor="middle" style="font-size:12px;fill:#aab">${['ground state','excited state','back to ground state'][s2]}</text></svg>`;
 const x=10+(190/300)*310;
 const sp=`<svg viewBox="0 0 330 80" width="100%"><defs><linearGradient id="g"><stop offset="0" stop-color="#7a3fb5"/><stop offset=".2" stop-color="#2a3fd0"/><stop offset=".35" stop-color="#2ab0e8"/><stop offset=".5" stop-color="#58c850"/><stop offset=".62" stop-color="#f5ee60"/><stop offset=".78" stop-color="#f58a14"/><stop offset="1" stop-color="#ee2222"/></linearGradient></defs>
 <rect x="10" y="20" width="310" height="26" fill="url(#g)"/><g style="font-size:10px"><text x="10" y="62">400 nm</text><text x="110" y="62">500</text><text x="213" y="62">600</text><text x="290" y="62">700 nm</text></g>
 ${wl?`<line x1="${x}" y1="12" x2="${x}" y2="50" stroke="currentColor" stroke-width="3"/><text x="${x}" y="9" text-anchor="middle" style="font-size:11px;font-weight:700">Na ≈ 590 nm</text>`:''}
 ${m2=='Mg'?'<text x="165" y="9" text-anchor="middle" style="font-size:11px;font-weight:700">Mg: outside this range</text>':''}</svg>`;
 const n=['The atom is in its <b>ground state</b>: all electrons in the lowest possible energy levels (e.g. sodium 2.8.1).','The flame supplies energy. An electron absorbs it and jumps to a higher level: the <b>excited state</b>.','The electron <b>immediately returns</b> to its ground state and releases the energy. If this matches visible light, a characteristic colour appears.'];
 return `<div class="card"><h2>What causes the colours? Electron transitions</h2>
 <div class="row">${['Li','Na','K','Ca','Sr','Ba','Mg'].map(k=>`<button class="btn ${k==m2?'on':''}" onclick="m2='${k}';s2=0;draw()">${M[k][1]}</button>`).join('')}<button class="btn p" onclick="play2()">▶ Play</button></div>
 <div class="two"><div class="stage">${a}</div><div><div class="row"><button class="btn ${s2==0?'on':''}" onclick="s2=0;draw()">①</button><button class="btn ${s2==1?'on':''}" onclick="s2=1;draw()">②</button><button class="btn ${s2==2?'on':''}" onclick="s2=2;draw()">③</button></div><p>${n[s2]}</p>
 ${s2==2?(vis?`<div class="res"><span class="sw" style="background:${c}"></span>${d[0]}: ${d[2]} flame.${wl?' Its transition is about <b>590 nm</b>: the yellow-orange part of the spectrum (the same as sodium street lights 💡).':''}</div>`:`<div class="res no"><b>${d[0]}</b>: the transition corresponds to a wavelength <b>outside the visible spectrum</b>, so there is no flame colour.</div>`):''}</div></div>
 <div class="stage lt" style="margin-top:8px">${sp}</div><p class="note">The visible spectrum covers about 400–700 nm (violet → red); UV is below 400 nm, infrared above 700 nm.</p></div>`}
/* T3 */
let s3=0;
const AS=[['Place the ammonium solid or solution in a test tube.',''],['Add sodium hydroxide solution.','NH₄⁺ + OH⁻ → NH₃ + H₂O'],['Warm the mixture: ammonia gas is released.','NH₄⁺ + OH⁻ → NH₃ + H₂O'],['Hold damp red litmus paper at the mouth of the tube: it turns blue (ammonia is the only common alkaline gas). You may notice its smell.','NH₃ is alkaline → litmus turns blue'],['Alternative: a rod dipped in concentrated hydrochloric acid makes white smoke of ammonium chloride.','NH₃ + HCl → NH₄Cl']];
function t3(){const k=s3;let v=`<svg viewBox="0 0 300 230" width="100%" style="max-width:360px;display:block;margin:auto"><g style="color:#dde">
 <path d="M120 40 V170 a30 30 0 0 0 60 0 V40" fill="none" stroke="currentColor" stroke-width="3"/>
 <path d="M122 120 V170 a28 28 0 0 0 56 0 V120z" fill="${k>=1?'rgba(120,200,255,.5)':'rgba(255,255,255,.25)'}"/></g>
 ${k>=2?'<path class="flick" d="M150 225 q-14 -16 0 -30 q14 14 0 30" fill="#ff9a2e" transform="translate(0,-8)"/>':''}
 ${k>=1&&k<2?[0,1,2].map(i=>`<circle class="bub" cx="${140+i*10}" cy="95" r="3" style="animation-delay:${i*.3}s;fill:#9cf"/>`).join('')+'<text x="214" y="70" style="font-size:12px" fill="#fff">NaOH(aq)</text>':''}
 ${k>=2?[0,1,2,3].map(i=>`<circle class="bub" cx="${132+i*12}" cy="150" r="4" style="animation-delay:${i*.4}s"/>`).join('')+'<text x="215" y="150" style="font-size:12px" fill="#fff">NH₃ gas</text>':''}
 ${k==3?`<rect class="pop" x="130" y="22" width="40" height="14" fill="#4a7de8" stroke="#fff"/><text x="215" y="30" style="font-size:12px" fill="#fff">damp litmus: red → blue</text>`:''}
 ${k==4?`<line x1="224" y1="10" x2="154" y2="50" stroke="#ccc" stroke-width="4"/><circle cx="152" cy="52" r="4" fill="#9fd"/>${[0,1,2,3].map(i=>`<circle class="smoke" cx="${146+i*8}" cy="50" r="8" style="animation-delay:${i*.5}s"/>`).join('')}<text x="228" y="30" style="font-size:12px" fill="#fff">conc. HCl rod → white smoke</text>`:''}</svg>`;
 return `<div class="card"><h2>The test for ammonium ions (NH₄⁺)</h2><p class="note">Ammonium gives <b>no flame colour</b>, so we use a chemical test with sodium hydroxide.</p>
 <div class="two"><div class="stage">${v}</div><div><p><b>Step ${k+1}/5:</b> ${AS[k][0]}</p>${AS[k][1]?`<div class="eq">${AS[k][1]}</div>`:''}
 <div class="row"><button class="btn" onclick="s3=Math.max(0,s3-1);draw()">◀</button><button class="btn p" onclick="s3=Math.min(4,s3+1);draw()">Next ▶</button></div>
 <div class="key"><b>Exam hint:</b> if asked for a safety precaution, say these tests are done in a <b>fume cupboard</b>.</div></div></div></div>`}
/* T4 */
const Q=[['Which cation gives this flame colour?',['Cu²⁺','Ba²⁺','Mg²⁺','K⁺'],1,'Barium compounds give an (apple) green flame.','Ba'],
['Which cation gives this flame colour?',['Na⁺','Rb⁺','K⁺','Cs⁺'],2,'Potassium is lilac.','K'],
['Why is concentrated hydrochloric acid used in a flame test?',['To cool the flame','To convert the compound to a chloride, which is more volatile','To colour the flame','To clean the Bunsen'],1,'Chlorides are more volatile than other salts, so they give better results.'],
['Why do magnesium compounds give no flame colour?',['Mg has no electrons','Its electron transition corresponds to a wavelength outside the visible spectrum','It is too reactive','It burns instead'],1,'The light emitted isn’t visible.'],
['What happens when an excited electron returns to its ground state?',['It absorbs energy','It releases energy, sometimes as visible light','It leaves the atom','Nothing'],1,'The released energy can be visible light of a characteristic colour.'],
['Why can a flame test fail to show other metals?',['Sodium impurities can hide other colours','Flames are too cool','Metals have no colour','Wires are too thin'],0,'Sodium’s intense yellow/orange masks other colours (and word descriptions are subjective).'],
['How do you test for ammonium ions?',['Add HCl and cool','Add NaOH solution, warm, test the gas with damp red litmus (turns blue)','Add water','Flame test'],1,'NH₄⁺ + OH⁻ → NH₃ + H₂O; ammonia is alkaline.'],
['What do you see when NH₃ meets HCl gas?',['Blue flame','White smoke of ammonium chloride','Green gas','Nothing'],1,'NH₃ + HCl → NH₄Cl.']];
let qi=0,qs=0,qa=null,my=null,myA=null,myS=0;
function newMy(){my=keys.filter(k=>M[k][3]&&k!='Cu')[Math.floor(Math.random()*8)];myA=null}
function t4(){if(!my)newMy();const cands=['Li','Na','K','Ca','Sr','Ba'];
 const mys=`<div class="card"><h2>🕵️ Mystery flame</h2><div class="stage" style="max-width:260px;margin:auto">${flame(my,true,false)}</div><p style="text-align:center">Which cation is in this sample?</p><div class="row" style="justify-content:center">${cands.map(k=>`<button class="btn ${myA==k?(k==my?'on':''):''}" ${myA==my?'disabled':''} onclick="myA='${k}';if('${k}'==my)myS++;draw()">${M[k][1]}</button>`).join('')}</div>
 ${myA?`<div class="res ${myA==my?'':'no'}">${myA==my?`Correct! ${M[my][0]} gives a ${M[my][2]} flame. Streak: ${myS}`:'Not quite – compare with Table A and try again.'}</div>`:''}<div class="row" style="justify-content:center"><button class="btn p" onclick="newMy();draw()">New sample</button></div></div>`;
 if(qi>=Q.length)return mys+`<div class="card"><h2>🏆 Score ${qs} / ${Q.length}</h2><p>${qs>=7?'Excellent – ready for the exam!':qs>=5?'Good! Revisit the animations for the tricky ones.':'Replay scenes 1–3 and try again.'}</p><button class="btn p" onclick="qi=0;qs=0;qa=null;draw()">Try again</button></div>`;
 const q=Q[qi];
 return mys+`<div class="card"><h2>Check your understanding</h2><p class="note">Question ${qi+1} of ${Q.length}</p><p><b>${q[0]}</b></p>${q[4]?`<div class="stage" style="max-width:220px">${flame(q[4],true,false)}</div>`:''}${q[1].map((o,i)=>`<button class="opt ${qa!=null?(i==q[2]?'good':i==qa?'bad':''):''}" ${qa!=null?'disabled':''} onclick="qa=${i};if(${i}==${q[2]})qs++;draw()">${o}</button>`).join('')}
 ${qa!=null?`<div class="res ${qa==q[2]?'':'no'}">${qa==q[2]?'Correct! ':'Not quite. '}${q[3]}</div><p><button class="btn p" onclick="qi++;qa=null;draw()">${qi==Q.length-1?'See score':'Next'} ▶</button></p>`:''}</div>`}
/* T5 */
let sh=[false,false];
const EX=[['Why is concentrated hydrochloric acid used in flame tests?','It converts any metal compound into a chloride. Chlorides are more volatile than other salts, so they are more likely to give a good flame colour.'],['Explain why barium compounds give a characteristic flame colour but magnesium compounds do not.','In the flame, electrons in barium absorb energy and move to a higher level (excited state), then return to the ground state releasing energy. For barium this energy corresponds to a wavelength in the visible spectrum, giving an apple-green colour. For magnesium the transition corresponds to a wavelength outside the visible range, so no colour is seen.']];
function t5(){return `<div class="card"><h2>✍️ Explain it in your own words</h2><p class="note">Write your answer first, then reveal the model answer.</p>${EX.map((e,i)=>`<div class="key"><b>${i+1}. ${e[0]}</b><br><button class="btn" onclick="sh[${i}]=!sh[${i}];draw()">${sh[i]?'Hide':'Show'} model answer</button>${sh[i]?`<div class="res">${e[1]}</div>`:''}</div>`).join('')}</div>`}
function draw(){$('#view').innerHTML=[t1,t2,t3,t4,t5][tab]()}
nav();draw();
</script></body></html>
